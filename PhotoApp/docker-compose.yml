services:
  photo-app-client:
    build:
      context: .
      dockerfile: PhotoApp.Client/Dockerfile
    container_name: photo-app-client
    ports:
      - "8080:80"
    restart: unless-stopped
  
  photo-app-api:
    build:
      context: .
      dockerfile: PhotoApp.Api/Dockerfile
    container_name: photo-app-api
    ports:
      - "5000:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
  
  photo-app-imageprocessor:
    build: 
      context: ./PhotoApp.ImageProcessor
      dockerfile: Dockerfile
    container_name: photo-app-imageprocessor
    ports:
      - "8082:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: photo-app-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: photoapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: photo-app-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:

